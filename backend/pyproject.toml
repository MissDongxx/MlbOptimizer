[project]
name = "lineuplab-backend"
version = "0.1.0"
description = "FastAPI backend for LineupLab MLB DFS optimizer"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.4",
    "fastapi>=0.115.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.8.0",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.4.0",
    "pybaseball>=2.2.7",
    "pydfs-lineup-optimizer>=3.6.1",
    "python-dotenv>=1.0.1",
    "scipy>=1.13.0",
    "MLB-StatsAPI>=1.8.1",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=0.1.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"data_worker.py" = ["E402"]
"main.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
