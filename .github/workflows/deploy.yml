name: Deploy DiamScore

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-vps:
    name: VPS backend and static frontend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || vars.VPS_PORT || '22' }}
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"

            cd /opt/diamscore
            git fetch origin "${{ github.ref_name }}"
            git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"
            git reset --hard "${{ github.sha }}"

            cd /opt/diamscore/backend
            uv sync --frozen
            systemctl restart diamscore-api
            for i in $(seq 1 10); do curl -fsS http://127.0.0.1:8000/health >/dev/null && break; sleep 2; done

            cd /opt/diamscore/frontend
            npm ci
            NEXT_PUBLIC_API_URL=/api npm run build

            install -d /var/www/diamscore
            find /var/www/diamscore -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a out/. /var/www/diamscore/
            nginx -t
            systemctl reload nginx

            curl -fsS http://127.0.0.1/api/players/today >/dev/null
